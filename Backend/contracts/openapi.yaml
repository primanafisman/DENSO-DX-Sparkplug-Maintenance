  "openapi": "3.0.3",
  "info": {
    "title": "Sparkplug Maintenance API",
    "version": "1.1.0",
    "description": "Only LOCAL_CV. ROI coordinates reference EXIF-oriented originals. Analog pressure: black needle, 0–1 MPa, three-decimal interpolation, no ±0.001 accuracy claim. Partial labels are suggestions requiring operator identity confirmation. Single worker/API process; TTL/restart invalidates temporary IDs. Database schemas never leak into frontend payloads. Reports use production dates, immutable snapshots and explicitly provisional paper_stdev_s or within_rbar_d2 calculations."
  },
